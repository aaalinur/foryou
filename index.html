<!DOCTYPE html>
<html lang="kk">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Кішкентай тосынсый ♡</title>


   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">

   <link rel="stylesheet" href="style.css">
</head>

<body>

   <main class="scene">

      <!-- Артқы фондағы әшекейлер -->
      <div class="sparkle sparkle-1">✧</div>
      <div class="sparkle sparkle-2">♡</div>
      <div class="sparkle sparkle-3">✦</div>
      <div class="sparkle sparkle-4">♡</div>

      <!-- Басты тақырып -->
      <header class="heading">
         <p class="small-title">A LITTLE SURPRISE FOR YOU</p>

         <h1>Күніңіз жақсы өтсін</h1>

         <div class="title-decoration">
            <span></span>
            <span class="tiny-heart">♡</span>
            <span></span>
         </div>
      </header>

      <!-- Конверт -->
      <section class="envelope-area">

         <div class="envelope" id="envelope">

            <!-- Хаттың қағазы -->
            <article class="letter" id="letter">

               <div class="letter-content">

                  <div class="letter-heart">♡</div>

                  <p class="letter-text">
                     Кейбір жандардың жай күлімдегені
                     әлемді жарығырақ, әрі әдемі етеді.
                  </p>

                  <p class="letter-text second-line">
                     Сондықтан күлімдеп жүріңіз.
                  </p>

                  <div class="letter-decoration">✧</div>

                  <p class="letter-signature">
                     Сізге арналған кішкентай тілек ♡
                  </p>

               </div>

            </article>

            <!-- Конверттің артқы бөлігі -->
            <div class="envelope-back"></div>

            <!-- Конверттің алдыңғы бөлігі -->
            <div class="envelope-front"></div>

            <!-- Ашылатын қақпақ -->
            <div class="envelope-flap"></div>

            <!-- Қызыл батырма -->
            <button class="open-button" id="openButton">
               <span>Басыңыз</span>
            </button>

         </div>

      </section>

      <!-- Төменгі жазу -->
      <footer class="footer" id="footer">
         <p>!</p>
      </footer>

      <!-- Қайта ашу -->
      <button class="replay-button" id="replayButton">
         Қайта оқу
      </button>

   </main>

   <script src="script.js"></script>

</body>

</html>
