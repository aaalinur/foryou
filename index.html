<!DOCTYPE html>
<html lang="kk">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Кішкентай тосынсый,</title>

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css?v=2">

   <style>
      /* Негізгі тілек бірінші және әрқашан көрініп тұрады */
      .letter-content {
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
      }

      .main-wish {
         display: block;
         width: 100%;
         margin-top: 0;
         color: #526875;
         font-size: clamp(17px, 3vw, 21px);
         line-height: 1.75;
         font-weight: 500;
      }

      .catmeme {
         display: block;
         width: min(100%, 260px);
         max-height: 220px;
         object-fit: contain;
         margin: 22px auto 0;
         order: 10;
      }

      @media (max-width: 600px) {
         .envelope.zoomed .letter {
            height: min(82dvh, 680px);
         }

         .main-wish {
            font-size: 16px;
         }

         .catmeme {
            width: min(100%, 230px);
            max-height: 180px;
            margin-top: 18px;
         }
      }
   </style>
</head>

<body>

   <main class="scene">
      <div class="sparkle sparkle-1">✧</div>
      <div class="sparkle sparkle-2">♡</div>
      <div class="sparkle sparkle-3">✦</div>
      <div class="sparkle sparkle-4">ә</div>

      <header class="heading">
         <p class="small-title">A LITTLE SURPRISE FOR YOU</p>
         <h1>Күніңіз жақсы өтсін</h1>
         <div class="title-decoration">
            <span></span>
            <span class="tiny-heart">,</span>
            <span></span>
         </div>
      </header>

      <section class="envelope-area">
         <div class="envelope" id="envelope">
            <article class="letter" id="letter">
               <div class="letter-content">
                  <div class="letter-heart">.</div>

                  <p class="letter-text main-wish">
                     Кейбір жандардың жай күлімдегені<br>
                     әлемді жарығырақ әрі әдемі етеді.<br>
                     Сондықтан күлімдеп жүріңіз.
                  </p>

                  <!-- Мем негізгі тілектің астында орналасады -->
                  <img class="catmeme" src="catmeme.png" alt="Көңілді мысықтың суреті">

                  <div class="letter-decoration">✧</div>

                  <p class="letter-signature">
                     !
                  </p>
               </div>
            </article>

            <div class="envelope-back"></div>
            <div class="envelope-front"></div>
            <div class="envelope-flap"></div>

            <button class="open-button" id="openButton">
               <span>Басыңыз</span>
            </button>
         </div>
      </section>

      <footer class="footer" id="footer">
         <p>!</p>
      </footer>

      <button class="replay-button" id="replayButton">
         Қайта оқу
      </button>
   </main>

   <script src="script.js"></script>
</body>

</html>
